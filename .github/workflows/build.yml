name: Build Android APK

# Runs automatically every time you push code to the main branch,
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (always latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Show Flutter/Dart version used for this build
        run: flutter --version

      - name: Generate Android platform files (if missing)
        run: flutter create --platforms=android --org com.noorapp --project-name noor_app .

      - name: Install dependencies
        run: flutter pub get

      - name: Force targetSdk/compileSdk to Android 16 (API 36)
        run: |
          sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts || true
          sed -i 's/flutter.targetSdkVersion/36/' android/app/build.gradle.kts || true

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          cat android/app/build.gradle.kts

      - name: Build debug APK (for quick testing on your phone)
        run: flutter build apk --debug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
