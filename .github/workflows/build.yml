name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android platform files (if missing)
        run: flutter create --platforms=android --org com.noorapp --project-name noor_app .

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (for quick testing on your phone)
        run: flutter build apk --debug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
